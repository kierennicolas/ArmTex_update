name: Build

# Builds and checks the RISC OS outputs. For Milestone 1 these are the
# toolchain test programs and the TLTest kit for Gate 1.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every run step uses bash with -eo pipefail, so a failure piped through tee
# fails the step. Without this, steps on the runner use "bash -e", which
# ignores a failure before the pipe, and steps in a container use sh.
defaults:
  run:
    shell: bash

# A newer push queues behind a running build instead of cancelling it, so a
# toolchain image build that is under way is never thrown away.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    name: Host-side tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (packaging and check tools)
        run: python3 -m unittest discover -v -s tests/scripts -p 'test_*.py'

      - name: Shell script lint
        run: shellcheck scripts/*.sh tests/scripts/*.sh

      - name: Manifest is valid JSON with the required pins
        run: |
          jq -e '.toolchain.gccsdk.revision | test("^[0-9a-f]{40}$")' upstream/manifest.json
          jq -e '.toolchain.image.name | test("^[a-z0-9._/-]+$")' upstream/manifest.json
          jq -e '.texlive.source.revision | test("^[0-9a-f]{40}$")' upstream/manifest.json
          jq -e '.texlive.support_files.sha256 | test("^[0-9a-f]{64}$")' upstream/manifest.json
          jq -e '.texlive.support_files.sha512 | test("^[0-9a-f]{128}$")' upstream/manifest.json
          jq -e '.texlive.support_files.tlpdb_sha256 | test("^[0-9a-f]{64}$")' upstream/manifest.json
          jq -e '.texlive.support_files.signing_key.fingerprint | test("^[0-9A-F]{40}$")' upstream/manifest.json

      - name: Test programs compile with the host compiler
        run: |
          mkdir -p host-build
          for f in tests/toolchain/*.c; do gcc -std=gnu99 -O2 -Wall -Werror -c -o host-build/x.o "$f"; done
          g++ -std=c++11 -O2 -Wall -Werror -c -o host-build/x.o tests/toolchain/cxx11.cc
          g++ -std=c++17 -O2 -Wall -Werror -c -o host-build/x.o tests/toolchain/cxx17.cc

  toolchain:
    name: Toolchain
    uses: ./.github/workflows/toolchain.yml
    permissions:
      contents: read
      packages: write

  build:
    name: Cross-compile and package
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          echo "Image: ${{ needs.toolchain.outputs.image }}"
          arm-unknown-riscos-gcc --version | head -1
          arm-unknown-riscos-g++ --version | head -1

      - name: Build test programs
        id: build
        run: |
          mkdir -p out-logs
          scripts/build-toolchain-tests.sh out 2>&1 | tee out-logs/build-tests.log

      - name: Check binaries
        id: check
        run: scripts/check-binaries.sh out 2>&1 | tee out-logs/check-binaries.log

      - name: Check that the binary checks reject bad files
        id: negative
        run: tests/scripts/test-check-binaries.sh out 2>&1 | tee out-logs/test-check-binaries.log

      - name: Package test kit
        id: kit
        run: |
          scripts/package-testkit.sh out 2>&1 | tee out-logs/package-testkit.log
          name="TLTest-${BUILD_COMMIT:0:12}.zip"
          cp out/TLTest.zip "out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Indicative only: the service runs RISC OS Pyromaniac, not RISC OS 5.30.
      # Skipped for pull requests from forks, which should not send builds to a
      # third-party service from this repository's CI.
      - name: Emulator evaluation (build.riscos.online)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/run-emulator.sh out/kit/TLTest out/emulator-commands.txt out/emulator 2>&1 | tee out-logs/emulator.log

      - name: Job summary
        if: always()
        run: |
          if [ -f out/results.json ]; then
            scripts/summarise-results.sh out >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/emulator/output.txt ]; then
            {
              echo
              echo "## Emulator evaluation (build.riscos.online)"
              echo
              echo "Indicative only: RISC OS Pyromaniac, not RISC OS 5.30. Last 150 lines of output:"
              echo
              echo '```'
              tail -n 150 out/emulator/output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Job logs live in storage that not every reader can reach; annotations
      # put the results and any failure on the run page and in the checks API.
      - name: Annotate results
        if: always()
        run: |
          if [ -f out/results.json ]; then
            scripts/summarise-results.sh out > out-logs/summary.md
            scripts/ci-annotate.sh notice "Build results" out-logs/summary.md 200
          fi
          annotate_failure() {
            if [ "$1" = failure ]; then
              scripts/ci-annotate.sh error "$2 output, last lines" "out-logs/$2.log" 60
            fi
          }
          annotate_failure "${{ steps.build.outcome }}" build-tests
          annotate_failure "${{ steps.check.outcome }}" check-binaries
          annotate_failure "${{ steps.negative.outcome }}" test-check-binaries
          annotate_failure "${{ steps.kit.outcome }}" package-testkit

      - name: Annotate emulator output
        if: always()
        run: |
          if [ -f out-logs/emulator.log ]; then
            grep -v '^      - ' out-logs/emulator.log > out-logs/emulator-short.log || true
            scripts/ci-annotate.sh notice "Emulator step output" out-logs/emulator-short.log 40
          fi
          if [ -f out/emulator/output.txt ]; then
            scripts/ci-annotate.sh notice "Emulator output (Pyromaniac; indicative only)" out/emulator/output.txt 200
          fi

      - name: Upload test kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: out/${{ steps.kit.outputs.name }}
          archive: false
          if-no-files-found: error

      - name: Upload build record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-record
          path: |
            out/results.json
            out/logs/
            out-logs/
            out/kit/
            out/emulator/output.txt
            out/emulator/stage/.robuild.yaml
          if-no-files-found: warn

  # The pinned support files (macros, fonts, configuration) from the TeX Live
  # 2026 image: the packages of scheme-basic, checked against every pin. The
  # TeX Live job builds a tree from them. The packages are cached, so the
  # 6.3 GB image is only downloaded when the pins or the package list change.
  support-files:
    name: Support files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    env:
      # With every package they depend on.
      PACKAGES: scheme-basic
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check TeX Live's signature on the image's checksum
        id: signature
        run: |
          mkdir -p sf-logs
          scripts/verify-iso-signature.sh 2>&1 | tee sf-logs/signature.log

      - name: Cache key
        id: key
        run: |
          image=$(jq -r '.texlive.support_files | "\(.file) \(.sha512)"' upstream/manifest.json | sha256sum | cut -c1-16)
          recipe=$({ cat scripts/fetch-upstream.sh scripts/lib/tlpdb.py scripts/lib/iso9660.py; echo "$PACKAGES"; } | sha256sum | cut -c1-16)
          echo "key=support-files-$image-$recipe" >> "$GITHUB_OUTPUT"

      - name: Restore packages
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sf
          key: ${{ steps.key.outputs.key }}

      - name: Take the packages from the image, checking every pin
        id: fetch
        env:
          SUPPORT_ISO_DIR: ${{ runner.temp }}/iso
        run: |
          df -h . | tail -n 1
          # Word splitting of PACKAGES is intended.
          # shellcheck disable=SC2086
          scripts/fetch-upstream.sh support-files sf $PACKAGES 2>&1 | tee sf-logs/fetch.log

      - name: Save packages
        if: steps.fetch.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sf
          key: ${{ steps.key.outputs.key }}

      - name: Size of scheme-basic
        if: steps.fetch.outcome == 'success'
        run: |
          db=sf/tlpkg/texlive.tlpdb
          mapfile -t packages < <(python3 scripts/lib/tlpdb.py resolve "$db" scheme-basic)
          bytes=$(python3 scripts/lib/tlpdb.py size "$db" "${packages[@]}")
          echo "scheme-basic: ${#packages[@]} packages, $((bytes / 1048576)) MiB of containers" | tee -a sf-logs/fetch.log

      - name: Annotations
        if: always()
        run: |
          level=notice
          if [ "${{ job.status }}" != success ]; then level=error; fi
          grep -v '^gpg: ' sf-logs/signature.log > sf-logs/signature-short.log || true
          scripts/ci-annotate.sh "$level" "Image signature" sf-logs/signature-short.log 40
          grep -v '^downloaded ' sf-logs/fetch.log > sf-logs/fetch-short.log || true
          scripts/ci-annotate.sh "$level" "Support files" sf-logs/fetch-short.log 60

  texlive:
    name: TeX Live cross build
    needs: [toolchain, support-files]
    # The cross build does not need the support files; only the tree does.
    if: always() && needs.toolchain.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned TeX Live source
        run: scripts/fetch-upstream.sh texlive-source upstream-src/texlive

      # Host tools depend only on the TeX Live source, the build script and the
      # host compiler in the toolchain image, so they are cached on all three.
      - name: Cache key for host tools
        id: key
        env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
        run: |
          revision=$(jq -r .texlive.source.revision upstream/manifest.json)
          script=$(sha256sum scripts/build-host-tools.sh | cut -c1-16)
          image=$(printf '%s' "$IMAGE" | sha256sum | cut -c1-16)
          echo "key=host-tools-${revision:0:12}-$script-$image" >> "$GITHUB_OUTPUT"

      - name: Restore host tools
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: host-tools
          key: ${{ steps.key.outputs.key }}

      - name: Build host tools
        id: hosttools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tl-logs
          scripts/build-host-tools.sh upstream-src/texlive host-tools 2>&1 | tee tl-logs/host-tools.log

      # Saved straight away rather than at the end of the job, so a failure
      # later in the job does not throw the host tools away.
      - name: Save host tools
        if: steps.hosttools.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: host-tools
          key: ${{ steps.key.outputs.key }}

      - name: Cross-build TeX Live components
        id: cross
        run: |
          mkdir -p tl-logs
          scripts/build-texlive.sh upstream-src/texlive host-tools tl-out 2>&1 | tee tl-logs/build-texlive.log

      - name: Check cross-compiled programs
        id: check
        if: always() && steps.cross.outcome != 'skipped'
        run: |
          shopt -s nullglob
          elfs=(tl-out/bin/*)
          aifs=(tl-out/aif/*)
          if [ ${#elfs[@]} -eq 0 ]; then
            echo "No programs were built; nothing to check."
            exit 0
          fi
          { scripts/check-binaries.sh --elf "${elfs[@]}" && scripts/check-binaries.sh --aif "${aifs[@]}"; } 2>&1 | tee tl-logs/check-binaries.log

      - name: Package the Gate 2 kit
        id: kpsekit
        if: always() && hashFiles('tl-out/aif/kpsewhich,ff8') != ''
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/package-kpse-kit.sh upstream-src/texlive tl-out 2>&1 | tee tl-logs/package-kpse-kit.log
          name="TLKpse-${BUILD_COMMIT:0:12}.zip"
          cp tl-out/TLKpse.zip "tl-out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Checks the kit's tree and ls-R with the native kpsewhich from the same
      # source, in place and after moving it. No RISC OS binary runs here.
      - name: Check the Gate 2 kit's tree
        id: kitcheck
        if: always() && steps.kpsekit.outcome == 'success'
        run: |
          scripts/test-kpse-kit.sh tl-out/kit/TLKpse host-tools/bin/kpsewhich 2>&1 | tee tl-logs/test-kpse-kit.log

      # Indicative only: RISC OS Pyromaniac, not RISC OS 5.30.
      - name: Emulator run of the Gate 2 kit
        if: always() && steps.kpsekit.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          scripts/run-emulator.sh tl-out/kit/TLKpse tl-out/kpse-emulator-commands.txt tl-out/emulator 2>&1 | tee tl-logs/emulator.log

      - name: Upload the Gate 2 kit
        if: always() && steps.kpsekit.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: tl-out/${{ steps.kpsekit.outputs.name }}
          archive: false
          if-no-files-found: error

      # Milestone 3: the texmf tree, font maps and formats, made on the host
      # with the host tools and TeX Live's own scripts.
      - name: Restore the support files
        id: sf
        if: always() && steps.hosttools.outcome != 'failure' && needs.support-files.result == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sf
          key: ${{ needs.support-files.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build the texmf tree and formats
        id: tree
        if: always() && steps.sf.outcome == 'success'
        run: scripts/build-texmf-tree.sh sf host-tools tl-tree 2>&1 | tee tl-logs/texmf-tree.log

      - name: Compile the test documents on the host
        id: docs
        if: always() && steps.tree.outcome == 'success'
        run: scripts/test-documents.sh tl-tree tl-docs 2>&1 | tee tl-logs/test-documents.log

      - name: Package the pdfTeX kits
        id: pdftexkit
        if: always() && steps.docs.outcome == 'success' && hashFiles('tl-out/aif/pdftex,ff8') != ''
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/package-pdftex-kit.sh tl-out tl-tree tl-docs emulator 2>&1 | tee tl-logs/package-pdftex-kit.log
          scripts/package-pdftex-kit.sh tl-out tl-tree tl-docs full 2>&1 | tee -a tl-logs/package-pdftex-kit.log
          name="TLPdfTeX-${BUILD_COMMIT:0:12}.zip"
          cp tl-out/TLPdfTeX.zip "tl-out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Indicative only: RISC OS Pyromaniac, not RISC OS 5.30. It does test
      # whether formats made on the build machine load in the RISC OS build.
      - name: Emulator run of the pdfTeX kit
        id: pdftexemu
        if: always() && steps.pdftexkit.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 15
        env:
          ROBUILD_ARTIFACT: Out
          ROBUILD_TIMEOUT: "600"
        run: |
          scripts/run-emulator.sh tl-out/kit/TLPdfTeXmini tl-out/pdftex-emulator-commands.txt tl-out/pdftex-emulator 2>&1 | tee tl-logs/pdftex-emulator.log

      - name: Compare the emulator's PDFs with the host's
        id: comparepdf
        if: always() && steps.pdftexemu.outcome == 'success'
        continue-on-error: true
        run: scripts/compare-emulator-pdfs.sh tl-out/pdftex-emulator tl-docs 2>&1 | tee tl-logs/compare-pdfs.log

      - name: Upload the pdfTeX kit
        if: always() && steps.pdftexkit.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: tl-out/${{ steps.pdftexkit.outputs.name }}
          archive: false
          if-no-files-found: error

      - name: Job summary and annotations
        if: always()
        run: |
          if [ -f tl-out/emulator/output.txt ]; then
            # kpsewhich's -debug output is long; annotate it separately, keeping
            # only the lines about the search itself.
            grep -v 'kdebug:' tl-out/emulator/output.txt > tl-logs/emulator-main.txt || true
            grep -E 'kdebug:(kpse_find_file|db:match|returning|start generic)' tl-out/emulator/output.txt > tl-logs/emulator-debug.txt || true
            scripts/ci-annotate.sh notice "Gate 2 kit in the emulator (Pyromaniac; indicative only)" tl-logs/emulator-main.txt 120
            scripts/ci-annotate.sh notice "Gate 2 kit in the emulator, search details" tl-logs/emulator-debug.txt 40
          elif [ -f tl-logs/emulator.log ]; then
            scripts/ci-annotate.sh notice "Gate 2 kit emulator step output" tl-logs/emulator.log 40
          fi
          if [ -f tl-out/results.json ]; then
            scripts/summarise-texlive.sh tl-out > tl-logs/summary.md
            cat tl-logs/summary.md >> "$GITHUB_STEP_SUMMARY"
            scripts/ci-annotate.sh notice "TeX Live cross build results" tl-logs/summary.md 120
            # The end of each failed required component's log.
            jq -r '[.components[] | select(.kind == "required" and .status != "built") | .log][:6][]' tl-out/results.json |
              while read -r log; do
                scripts/ci-annotate.sh error "$(basename "$log") (required component), last lines" "tl-out/$log" 40
              done
            # The end of each failed probe's log, collected into one note.
            jq -r '.components[] | select(.kind == "probe" and .status != "built") | "\(.name) \(.status) \(.log)"' tl-out/results.json |
              while read -r name status log; do
                echo "===== $name: $status ====="
                # configure's own error, and the compiler's errors on its test
                # programs (the program text in between is long and left out).
                grep -m 4 -E 'configure:[0-9]*: error' "tl-out/$log" || true
                awk '/configure:[0-9]+: checking /{ check = $0; shown = 0; next }
                     /conftest\.[a-z]+:[0-9]+(:[0-9]+)?: (error|sorry)/{ if (!shown) { print check; shown = 1 } print }' \
                  "tl-out/$log" | tail -n 14
                grep -m 8 -E 'undefined reference|ld: |Error [0-9]+' "tl-out/$log" || true
                tail -n 6 "tl-out/$log"
              done > tl-logs/probe-failures.txt
            if [ -s tl-logs/probe-failures.txt ]; then
              scripts/ci-annotate.sh notice "Failed probes, first errors and last lines" tl-logs/probe-failures.txt 400
            fi
          fi
          if [ "${{ steps.kitcheck.outcome }}" = failure ]; then
            scripts/ci-annotate.sh error "Gate 2 kit tree check" tl-logs/test-kpse-kit.log 40
          fi
          if [ "${{ steps.check.outcome }}" = failure ]; then
            scripts/ci-annotate.sh error "check-binaries output" tl-logs/check-binaries.log 40
          fi
          for f in host-tools build-texlive; do
            if [ -f "tl-logs/$f.log" ] && [ ! -f tl-out/results.json ]; then
              scripts/ci-annotate.sh error "$f output, last lines" "tl-logs/$f.log" 40
            fi
          done

      # Separate from the step above: GitHub keeps only ten annotations of
      # each level per step.
      - name: Milestone 3 annotations
        if: always()
        run: |
          if [ -f tl-tree/tree.json ]; then
            grep -E '^[0-9]+ packages' tl-logs/texmf-tree.log > tl-logs/texmf-tree-summary.txt || true
            scripts/ci-annotate.sh notice "texmf tree and formats" tl-logs/texmf-tree-summary.txt 5
          fi
          if [ "${{ steps.tree.outcome }}" = failure ]; then
            scripts/ci-annotate.sh error "texmf tree and formats, last lines" tl-logs/texmf-tree.log 60
          fi
          if [ -f tl-logs/test-documents.log ]; then
            level=notice
            if [ "${{ steps.docs.outcome }}" = failure ]; then level=error; fi
            scripts/ci-annotate.sh "$level" "Test documents on the host" tl-logs/test-documents.log 60
          fi
          if [ -f tl-logs/package-pdftex-kit.log ]; then
            grep -E '^pdfTeX kit|error' tl-logs/package-pdftex-kit.log > tl-logs/pdftex-kit-summary.txt || true
            scripts/ci-annotate.sh notice "pdfTeX kits" tl-logs/pdftex-kit-summary.txt 10
          fi
          if [ -f tl-logs/compare-pdfs.log ]; then
            scripts/ci-annotate.sh notice "Emulator PDFs against the host's" tl-logs/compare-pdfs.log 40
          fi
          if [ -f tl-out/pdftex-emulator/output.txt ]; then
            scripts/ci-annotate.sh notice "pdfTeX kit in the emulator (Pyromaniac; indicative only)" tl-out/pdftex-emulator/output.txt 200
          elif [ -f tl-logs/pdftex-emulator.log ]; then
            scripts/ci-annotate.sh notice "pdfTeX emulator step output" tl-logs/pdftex-emulator.log 60
          fi

      - name: Upload TeX Live build record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: texlive-build-record
          path: |
            tl-out/results.json
            tl-out/logs/
            tl-logs/
            host-tools/host-tools.json
            host-tools/logs/
            tl-out/kit/
            tl-out/emulator/output.txt
            tl-tree/tree.json
            tl-tree/logs/
            tl-docs/
            tl-out/pdftex-emulator/output.txt
            tl-out/pdftex-emulator/result,*
            tl-out/pdftex-emulator/pdf/
          if-no-files-found: warn
